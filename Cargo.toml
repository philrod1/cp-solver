[workspace]
members = ["crates/solver", "crates/lang", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
solver = { path = "crates/solver" }
lang   = { path = "crates/lang" }
proptest = "1"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
